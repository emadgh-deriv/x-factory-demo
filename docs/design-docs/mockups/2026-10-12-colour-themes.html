<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colour themes mockup</title>
<style>
/* Page chrome only. Product UI inside .mk-screen uses the project's design system and tokens. */
:root{--mk-bg:#f4f5f8;--mk-fg:#1b2030;--mk-muted:#5b6275;--mk-line:#d9dce5;--mk-ann:#7c3aed}
body{margin:0;background:var(--mk-bg);color:var(--mk-fg);font:15px/1.5 system-ui,sans-serif}
.mk-page{max-width:1400px;margin:0 auto;padding:32px 24px 64px}
.mk-page h1{margin:0 0 4px;font-size:28px}
.mk-status{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mk-ann);border:1px solid var(--mk-ann);border-radius:99px;padding:2px 10px}
.mk-section{margin-top:40px}
.mk-section h2{font-size:20px;margin:0 0 12px}
.mk-row{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.mk-frame{display:flex;flex-direction:column;gap:8px}
.mk-frame figcaption{font-size:13px;color:var(--mk-muted);font-weight:600}
/* transform contains fixed-position overlays (dialogs, sheets) inside the frame */
.mk-screen{position:relative;overflow:hidden;background:#fff;border:1px solid var(--mk-line);border-radius:10px;transform:translateZ(0)}
.mk-desktop{width:1280px;height:800px}
.mk-portrait{width:390px;height:844px;border-radius:28px}
.mk-landscape{width:844px;height:390px;border-radius:28px}
.mk-ann{position:absolute;z-index:999;width:22px;height:22px;border-radius:50%;background:var(--mk-ann);color:#fff;font:700 12px/22px system-ui;text-align:center;box-shadow:0 0 0 3px #fff}
.mk-new{outline:2px dashed var(--mk-ann);outline-offset:2px}
.mk-caveat{margin-top:16px;padding:12px 16px;border-left:4px solid #d97706;background:#fff7e6}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script type="module" src="https://esm.run/@material/web@2.2.0/all.js"></script>
<style>
/* MD3 tokens, Stadium Blue seed #1565C0, light scheme (build generates these with material-color-utilities) */
.app{--md-ref-typeface-brand:Roboto;--md-ref-typeface-plain:Roboto;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column}
.app .material-symbols-outlined{font-family:'Material Symbols Outlined';font-size:24px;line-height:1;font-style:normal;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.rel{position:relative}
.bar{position:relative;height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 16px 0 8px;background:var(--md-sys-color-surface);border-bottom:1px solid var(--md-sys-color-surface-container-high)}
.bar .brand{color:var(--md-sys-color-primary);padding:0 8px}
.bt{font-size:22px;line-height:28px;font-weight:400}
.sp{flex:1}
.body{flex:1;overflow:hidden;padding:0 16px}
.col{max-width:840px;margin:0 auto}
.ph2{font-size:24px;line-height:32px;font-weight:400;margin:20px 0 12px}
.card{position:relative;display:flex;gap:16px;padding:12px;margin-bottom:12px;border-radius:12px;background:var(--md-sys-color-surface-container-low);color:inherit;text-decoration:none}
.card:hover{background:color-mix(in srgb,var(--md-sys-color-on-surface) 8%,var(--md-sys-color-surface-container-low))}
.thumb{position:relative;flex:none;width:200px;height:125px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.thumb.ph{background:var(--md-sys-color-surface-container-highest);color:var(--md-sys-color-on-surface-variant)}
.ill{font-size:11px;color:#fff;opacity:.75;letter-spacing:.05em;text-transform:uppercase}
.ct{min-width:0;display:flex;flex-direction:column;gap:6px}
.hl{font-size:22px;line-height:28px;font-weight:400;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tr{margin:0;font-size:14px;line-height:20px;color:var(--md-sys-color-on-surface-variant);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{position:relative;font-size:12px;line-height:16px;font-weight:500;color:var(--md-sys-color-on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{position:relative;display:inline-flex;align-items:center;gap:4px;margin-right:8px;padding:0 8px;height:20px;border-radius:10px;vertical-align:3px;background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);font-size:11px;font-weight:500;letter-spacing:.5px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--md-sys-color-error)}
.metaw{position:relative;min-width:0}
.more{display:flex;justify-content:center;margin:20px 0 8px}
.attr{text-align:center;font-size:11px;color:var(--md-sys-color-on-surface-variant);padding:8px 0 24px}
.art{max-width:720px;padding-top:24px}
.mk-small{font-size:11px;color:#7c3aed}
.ah{font-size:36px;line-height:44px;font-weight:400;margin:12px 0 12px}
.sf{font-size:16px;line-height:24px;color:var(--md-sys-color-on-surface-variant);margin:0 0 12px}
.am{font-size:14px;font-weight:500;color:var(--md-sys-color-on-surface-variant);margin-bottom:16px}
.mainimg{margin:0 0 16px}
.mainimg .img{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#6b5a4a,#222);display:flex;align-items:center;justify-content:center}
.mainimg figcaption{font-size:12px;line-height:16px;color:var(--md-sys-color-on-surface-variant);margin-top:6px}
.prose p{font-size:16px;line-height:1.6;margin:0 0 16px}
.prose a{color:var(--md-sys-color-primary)}
.ext{margin:8px 0 32px}
.skb{border-radius:6px;background:linear-gradient(90deg,var(--md-sys-color-surface-container-high) 25%,var(--md-sys-color-surface-container) 50%,var(--md-sys-color-surface-container-high) 75%);background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.sk .l1{height:24px;width:90%}.sk .l2,.art .l2{height:14px;width:100%;margin:8px 0}.sk .l3,.art .l3{height:12px;width:40%;margin:8px 0}
.skb.h1{height:36px;width:100%;margin:12px 0}.skb.h1.s{width:60%}.skb.img{aspect-ratio:16/9;margin:16px 0}
.body.end{display:flex;flex-direction:column;justify-content:flex-end}.body.end>.col{width:100%}
.center{display:flex;align-items:center;justify-content:center}
.panel{text-align:center;max-width:320px;padding:24px}

.thumb.img{background:linear-gradient(135deg,#3d5a40,#1c2a1e)}
.mk-mini .bar{height:56px}
/* Theme menu surface (new) */
.tm{position:absolute;z-index:20;top:60px;right:12px;width:288px;padding:16px;border-radius:16px;background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface);box-shadow:0 2px 6px 2px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.3)}
.tm h3{margin:0 0 12px;font-size:14px;line-height:20px;font-weight:500;color:var(--md-sys-color-on-surface-variant)}
.sw{display:flex;justify-content:space-between;margin-bottom:20px}
.swi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;width:56px;text-align:center;line-height:16px}
.dot{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-sizing:border-box}
.dot.on{outline:2px solid var(--md-sys-color-on-surface);outline-offset:3px}
.seg{display:flex;height:40px;border:1px solid var(--md-sys-color-outline);border-radius:20px;overflow:hidden}
.seg span{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;font-size:14px;font-weight:500;border-left:1px solid var(--md-sys-color-outline)}
.seg span:first-child{border:0}
.seg .on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.app .seg .icon,.app .dot .icon{font-size:18px;width:18px;overflow:hidden;flex:none}
.seg span{position:relative}.app .seg .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%)}
.mk-matrix{display:grid;grid-template-columns:repeat(4,max-content);gap:24px}
.mk-matrix .mk-screen{width:300px;height:520px;border-radius:24px}
</style>
</head>
<body><div class="mk-page" id="page"></div>
<script>
const ICON = n => `<span class="material-symbols-outlined icon">${n}</span>`;
const SEEDS = {green:['Pitch Green','#2E7D32'],blue:['Stadium Blue','#1565C0'],gold:['Trophy Gold','#B8860B'],red:['Guardian Red','#C62828']};
const ITEMS = [ // illustrative, shaped like /search results
 ['Norris edges Piastri in Austin sprint as title fight tightens','Lando Norris held off his McLaren teammate over a frantic final lap…','Giles Richards','12 min ago',false],
 ['England v Wales: Six Nations women’s rugby – live','Updates from Twickenham as the Red Roses chase a fourth straight win…','Daniel Gallan','Live',true],
 ['Arsenal’s set-piece edge is no accident, it is a system','Nicolas Jover’s routines have become the most feared weapon in the league…','Jonathan Wilson','1 hr ago',false],
 ['Sabalenka fights back to reach Wuhan Open semi-final','The world No 1 recovered from a set down against Jessica Pegula…','Tumaini Carayol','2 hr ago',false],
];
const ann = (n,x,y) => `<span class="mk-ann" style="left:${x}px;top:${y}px">${n}</span>`;
function bar(back, marks){
 return `<header class="bar">${back?`<md-icon-button>${ICON('arrow_back')}</md-icon-button>`:`<span class="brand">${ICON('sports_soccer')}</span>`}
 <span class="bt">Sport-Radar</span><span class="sp"></span>${back?'':`<md-icon-button>${ICON('view_module')}</md-icon-button>`}
 <md-icon-button class="mk-new">${ICON('palette')}</md-icon-button>${back?`<md-icon-button>${ICON('open_in_new')}</md-icon-button>`:''}</header>`;
}
function list(compact){
 return `<main class="body"><div class="col"><h1 class="ph2">Latest sport</h1>${ITEMS.map(([h,t,b,d,l])=>`<a class="card"${compact?' style="gap:12px;padding:10px"':''}><div class="thumb img" style="${compact?'width:96px;height:72px':''}"><span class="ill">illustrative</span></div><div class="ct"><div class="hl" style="${compact?'font-size:16px;line-height:22px;-webkit-line-clamp:3':''}">${l?'<span class="live"><i></i>LIVE</span>':''}${h}</div>${compact?'':`<p class="tr">${t}</p>`}<div class="meta">${b} · ${d}</div></div></a>`).join('')}</div></main>`;
}
function article(compact){
 return `<main class="body"><div class="col art"><h1 class="ah" style="${compact?'font-size:26px;line-height:32px':''}">Norris edges Piastri in Austin sprint as title fight tightens</h1><p class="sf">Lando Norris held off his McLaren teammate over a frantic final lap to cut the gap to 14 points.</p><div class="am">Giles Richards · Sat 11 Oct 2026 20:41</div><figure class="mainimg"><div class="img"><span class="ill">illustrative</span></div></figure><div class="prose"><p>Norris had the edge from the start, but Piastri closed to within <a>half a second</a> on the final lap…</p></div><md-outlined-button class="ext">Read on The Guardian</md-outlined-button></div></main>`;
}
function menu(theme, mode){
 return `<div class="tm mk-new" role="dialog" aria-label="Theme"><h3>Colour</h3><div class="sw">${Object.entries(SEEDS).map(([k,[n,c]])=>`<span class="dot ${k===theme?'on':''}" style="background:${c}" role="radio" aria-label="${n}">${k===theme?ICON('check'):''}</span>`).join('')}</div>
 <h3>Mode</h3><div class="seg">${[['light','light_mode','Light'],['dark','dark_mode','Dark']].map(([k,i,n])=>`<span class="${k===mode?'on':''}">${k===mode?ICON("check"):""}${n}</span>`).join('')}</div></div>`;
}
function screen(size, theme, mode, content){
 return `<div class="mk-screen mk-${size} app rel" data-theme="${theme}" data-mode="${mode}">${content}</div>`;
}
const fig = (cap, html) => `<figure class="mk-frame">${html}<figcaption>${cap}</figcaption></figure>`;
const sec = (t, inner) => `<section class="mk-section"><h2>${t}</h2><div class="mk-row">${inner}</div></section>`;
const C = s => s==='desktop'?false:true;

let p = `<h1>4 colour themes × light/dark</h1><span class="mk-status">Built</span> · <a href="2026-10-12-colour-themes.md">spec (md)</a> · MVP backlog #3
<div class="mk-caveat">No data dependency: theming is client-only. Headlines and images are <b>illustrative</b>. Colours are generated from the four seeds with <code>SchemeFidelity</code> (material-color-utilities 0.3.0); dashed purple = new.</div>`;

// 1 · Theme menu open (Stadium Blue, Light)
p += sec('1 · Theme menu open (Stadium Blue · Light)',
 ['desktop','portrait','landscape'].map(s=>fig(s, screen(s,'blue','light', bar(false)+list(C(s))+menu('blue','light')
  + ann(1, s==='desktop'?1210:s==='portrait'?318:772, 4) + ann(2, s==="desktop"?1000:s==="portrait"?140:580, 76) + ann(3, s==="desktop"?1000:s==="portrait"?140:580, 180) + ann(4, s==='desktop'?1240:s==='portrait'?360:810, 90)))).join(''));

// 2 · matrix
let m='';
for (const t of Object.keys(SEEDS)) for (const md of ['light','dark']) m += fig(`${SEEDS[t][0]} · ${md}`, `<div class="mk-screen app rel" data-theme="${t}" data-mode="${md}">${bar(false)}${list(true)}</div>`);
p += `<section class="mk-section"><h2>2 · Headline list in every theme (8 combos, compact width)</h2><div class="mk-matrix">${m}</div></section>`;
p += sec('2 · Same screen, full frames (Guardian Red · dark, Trophy Gold · dark)',
 fig('desktop · red dark', screen('desktop','red','dark',bar(false)+list(false)+ann(5,24,80)))
 + fig('portrait · red dark', screen('portrait','red','dark',bar(false)+list(true)))
 + fig('landscape · gold dark', screen('landscape','gold','dark',bar(false)+list(true))));

// 3 · article
p += sec('3 · Article in a non-default theme (Pitch Green · dark, menu reachable from article)',
 ['desktop','portrait','landscape'].map(s=>fig(s, screen(s,'green','dark', bar(true)+article(C(s))+(s==='portrait'?menu('green','dark'):'')
  + ann(6, s==='desktop'?1162:s==='portrait'?270:724, 4)))).join(''));
document.getElementById('page').innerHTML = p;
</script>
</body></html>
